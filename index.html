};

/* ══════════════════════════════════════════════════════════════════════
   아래는 화면을 그리는 코드입니다. 건드리지 않아도 됩니다.
   ══════════════════════════════════════════════════════════════════════ */
(function(){
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/&(?![a-z#]+;)/g,"&amp;");
  const T0 = CV.chartFrom, T1 = CV.chartTo, SPAN = T1 - T0;
  const d = new Date();
  const NOW = Math.min(d.getFullYear() + d.getMonth()/12, T1 - 0.02);

  const val = (s) => {
    if (s === "now") return NOW;
    const [y,m] = String(s).split("-").map(Number);
    return y + ((m||1)-1)/12;
  };
  const pct = (v) => ((Math.max(T0, Math.min(T1, v)) - T0) / SPAN) * 100;

  /* ---- masthead ---- */
  $("js-name").textContent = CV.name;
  $("js-email").textContent = CV.email;
  $("js-email").setAttribute("href", "mailto:" + CV.email);

  let metaHTML = CV.metaLines.map(l => `<span>${esc(l)}</span>`).join("");
  if (CV.links.length)
    metaHTML += `<span class="masthead-links">` +
      CV.links.map(l => `<a href="${l.url}" rel="me" target="_blank">${esc(l.label)} ↗</a>`).join("") +
      `</span>`;
  $("js-lines-meta").innerHTML = metaHTML;

  $("js-foot-left").innerHTML = `${esc(CV.name)} — <a href="mailto:${CV.email}">${esc(CV.email)}</a>`;
  $("js-foot-right").textContent = "Last updated " +
    d.toLocaleDateString("en-US",{month:"long",year:"numeric"});

  /* ---- axis ---- */
  let lines = "", axis = "";
  for (let y = T0; y <= T1; y++) lines += `<div class="tl-vline" style="left:${pct(y)}%"></div>`;
  lines += `<div class="tl-today" style="left:${pct(NOW)}%"></div>`;
  for (let y = T0; y < T1; y++)
    axis += `<div class="tl-year" style="left:${pct(y)}%">&nbsp;’${String(y).slice(2)}</div>`;
  $("js-lines").innerHTML = lines;
  $("js-axis").innerHTML = axis;

  /* ---- lane packing: overlapping items get their own row ---- */
  function pack(items){
    const lanes = [];
    items.slice().sort((a,b) => val(a.start) - val(b.start)).forEach(it => {
      const s = val(it.start), e = val(it.end);
      let lane = lanes.find(L => L.end <= s + 0.001);
      if (!lane){ lane = { end:-99, items:[] }; lanes.push(lane); }
      lane.items.push(it); lane.end = e;
    });
    return lanes;
  }

  let idx = 0;
  const captions = {};

  function barsHTML(items, prefix){
    return pack(items).map(lane =>
      `<div class="tl-lane">` + lane.items.map(it => {
        const key = prefix + "-" + CV[prefix].indexOf(it);
        captions[key] = it;
        const left = pct(val(it.start)), w = Math.max(pct(val(it.end)) - left, 0.45);
        const cls = "bar" + (it.end === "now" ? " is-now" : "") + (it.tentative ? " is-tentative" : "");
        return `<button class="${cls}" style="left:${left}%;width:${w}%;--i:${idx++}"
                 data-key="${key}" aria-label="${esc(it.title)}, ${esc(it.when)}"></button>`;
      }).join("") + `</div>`
    ).join("");
  }

  function marksHTML(items, prefix, open){
    return `<div class="tl-lane">` + items.map(it => {
      const key = prefix + "-" + CV[prefix].indexOf(it);
      captions[key] = it;
      return `<button class="mark${open ? " is-open" : ""}" style="left:${pct(val(it.date))}%;--i:${idx++}"
               data-key="${key}" aria-label="${esc(it.venue || it.title)}"></button>`;
    }).join("") + `</div>`;
  }

  /* ---- tracks ---- */
  const rows = [
    { label:"Publications",  html: marksHTML(CV.publications,"publications",false) },
    { label:"Awards & IP",   html: "" },
    { label:"Education",     html: barsHTML(CV.education,"education") },
    { label:"Collaboration", html: barsHTML(CV.collaboration,"collaboration") },
    { label:"Experience",    html: barsHTML(CV.experience,"experience") },
    { label:"Teaching",      html: barsHTML(CV.teaching,"teaching") },
    { label:"Leadership",    html: barsHTML(CV.leadership,"leadership") }
  ];

  // Awards & IP row: rebuild so patents keep their own keys
  rows[1].html = `<div class="tl-lane">` +
    CV.awards.map((it,i) => {
      captions["awards-"+i] = it;
      return `<button class="mark is-open" style="left:${pct(val(it.date))}%;--i:${idx++}" data-key="awards-${i}" aria-label="${esc(it.title)}"></button>`;
    }).join("") +
    CV.patents.map((it,i) => {
      captions["patents-"+i] = it;
      return `<button class="mark is-open" style="left:${pct(val(it.date))}%;--i:${idx++}" data-key="patents-${i}" aria-label="${esc(it.title)}"></button>`;
    }).join("") + `</div>`;

  $("js-tracks").innerHTML = rows.map(r =>
    `<div class="tl-row"><div class="tl-label">${r.label}</div><div class="tl-lanes">${r.html}</div></div>`
  ).join("");

  /* ---- caption ---- */
  const DEFAULT_CAPTION =
    `<div class="tl-legend">
       <span><i class="swatch"></i>Completed</span>
       <span><i class="swatch live"></i>Ongoing</span>
       <span><i class="swatch dot"></i>Publication</span>
       <span><i class="swatch open"></i>Award or patent</span>
     </div>`;
  const cap = $("js-caption");
  cap.innerHTML = DEFAULT_CAPTION;

  function show(key){
    const it = captions[key]; if (!it) return;
    const title = it.cite || `<strong>${it.title}</strong>${it.sub ? " — " + it.sub : ""}`;
    cap.innerHTML = `<div>${title}<span class="cap-when">${it.when || it.venue || ""}${it.note ? " · " + it.note : ""}</span></div>`;
  }

  $("js-tracks").addEventListener("mouseover", e => {
    const b = e.target.closest("[data-key]"); if (b) show(b.dataset.key);
  });
  $("js-tracks").addEventListener("focusin", e => {
    const b = e.target.closest("[data-key]"); if (b) show(b.dataset.key);
  });
  $("js-tracks").addEventListener("mouseleave", () => { cap.innerHTML = DEFAULT_CAPTION; });
  $("js-tracks").addEventListener("click", e => {
    const b = e.target.closest("[data-key]"); if (!b) return;
    show(b.dataset.key);
    const target = document.getElementById("e-" + b.dataset.key);
    if (target){
      target.scrollIntoView({ behavior:"smooth", block:"center" });
      target.classList.remove("flash"); void target.offsetWidth; target.classList.add("flash");
    }
  });

  /* ---- sections ---- */
  function itemHTML(it, key){
    return `<div class="item" id="e-${key}">
      <p class="item-title">${it.title}${it.role ? `<span class="role">${it.role}</span>` : ""}</p>
      <span class="item-when${it.tentative ? " tentative" : ""}">${it.when || ""}</span>
      ${it.sub ? `<p class="item-sub">${it.sub}</p>` : ""}
    </div>`;
  }

  function section(label, body, note){
    return `<section class="sec"><div class="sec-label">${label}</div><div class="sec-body">${
      note ? `<p class="sec-note">${note}</p>` : ""}${body}</div></section>`;
  }

  const linkBtn = (url, label) =>
    url ? `<a class="pub-link" href="${url}" target="_blank" rel="noopener">${label} ↗</a>` : "";

  const pubs = CV.publications.map((p,i) =>
    `<article class="pub" id="e-publications-${i}">
       <p class="pub-cite">${p.cite}</p>
       <p class="pub-meta"><span class="venue">${p.venue}</span>${
         p.award ? `<span class="pub-award">★ ${p.award}</span>` : ""}${
         linkBtn(p.url,"Paper")}${linkBtn(p.pdf,"PDF")}${linkBtn(p.site,"Project")}</p>
     </article>`).join("");

  $("js-sections").innerHTML =
      section("Publications", pubs)
    + section("Industry–Academia Collaboration",
        CV.collaboration.map((x,i) => itemHTML(x,"collaboration-"+i)).join(""),
        CV.collaborationNote)
    + section("Professional Experience", CV.experience.map((x,i) => itemHTML(x,"experience-"+i)).join(""))
    + section("Teaching",    CV.teaching.map((x,i) => itemHTML(x,"teaching-"+i)).join(""))
    + section("Leadership",  CV.leadership.map((x,i) => itemHTML(x,"leadership-"+i)).join(""))
    + section("Education",   CV.education.map((x,i) => itemHTML(x,"education-"+i)).join(""))
    + section("Awards",      CV.awards.map((x,i) => itemHTML(x,"awards-"+i)).join(""))
    + section("Patents &amp; Copyright", CV.patents.map((x,i) => itemHTML(x,"patents-"+i)).join(""));
})();
</script>
</body>
</html>
